<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#06060a"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6e8"/>
      <stop offset="100%" stop-color="#efe6cc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d76b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a7220"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- back card (tilted) -->
  <g transform="rotate(-14 256 268)">
    <rect x="158" y="128" width="196" height="282" rx="22" fill="#15161e" stroke="#d4af37" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <!-- front card -->
  <g transform="rotate(8 256 268)">
    <rect x="158" y="128" width="196" height="282" rx="22" fill="url(#card)" stroke="#d4af37" stroke-opacity="0.85" stroke-width="3"/>
    <rect x="170" y="140" width="172" height="258" rx="16" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="2"/>
    <!-- multiplier glyph -->
    <text x="256" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="180" font-weight="700" fill="url(#gold)" text-anchor="middle">&#215;</text>
    <!-- corner pips -->
    <text x="190" y="178" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1a160d" text-anchor="middle">&#9824;</text>
    <text x="322" y="382" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1a160d" text-anchor="middle" transform="rotate(180 322 368)">&#9824;</text>
  </g>
</svg>
